spi_slave_map:
    adc: 0
    switch: 1
    temp: 2
    pot_ito: 3
    pot_tx: 4

spi_cmd_map:
    standard: 0
    jumbo: 1
    stream: 2

spi_switch_map:
    rx:
        spi_ch: 0
        spi_reg: rx_switch
        signal_pos:
            rx_out_1021: 0
            rx_out_1020: 1
            rx_out_1018: 2
            rx_out_1025: 3
            rx_out_1026: 4
            rx_out_1019: 5
            rx_out_4: 6
            rx_out_3: 7
            rx_out_2: 8
            rx_out_1: 9
            rx_rtd_temp: 10
            ito_dr_mon: 11
            rx_pol: 12
            rx_tp1: 13
            ci: 14
            tp177: 15
    tx:
        spi_ch: 1
        spi_reg: tx_switch
        signal_pos:
            tx_out_1021: 0
            tx_out_1020: 1
            tx_out_1018: 2
            tx_out_1025: 3
            tx_out_1026: 4
            tx_out_1019: 5
            tx_out_4: 6
            tx_out_3: 7
            tx_out_2: 8
            tx_out_1: 9
            tx_rtd_temp: 10
            vddatx: 11
            tx_pol: 12
            tx_tp1: 13
            vddah: 14
            tp159: 15

adc_ch_map:
    # format is [spi_ch, adc_ch_sel]
    tx_curr_sense: [0, 0]
    rx_curr_sense: [0, 1]
    tx_switch_out: [1, 0]
    rx_switch_out: [1, 1]
