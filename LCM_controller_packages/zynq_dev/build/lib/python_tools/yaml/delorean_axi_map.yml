
base_addrs:
    # LCM must be aligned to 4KiB boundaries (12 addr LSBs zero).
    lcm:        0x43C0_0000
    # SPI must be aligned to 4KiB boundaries (12 addr LSBs zero).
    spi:        0x43C1_0000
    # CDMA must be aligned to 128-byte boundaries (7 addr LSBs zero).
    cdma:       0x7E20_0000
    # BRAM CTRL must be aligned to 4KiB boundaries (12 addr LSBs zero).
    bram_ctrl:  0x8000_0000
    hp0:        0x1000_0000

