# Silicon photo multiplier
#     (1) pde: SiPM photon detection efficiency.  Set in the radiometric model
#              (RMM) and appears here for purpose of documentation.
#     (2) pe1_vpk_model:  The RMM sipm 1 p.e. level [a.u.]
#     (3) pe1_vpk: The expected TJazz 1 p.e. output (~2 mV TBD)
#
#      The simulation scales the voltage level of the RMM output appropriately
#      inside rmm_utils.get_rmm_sipm_output()
#
-  sipm:
     pde: 0.04
     pe1_pk_model: 1
     pe1_vpk: 2.3e-3
# Analog front end
#     (1) lpf_order: Order of low-pass filter emulating AFE filtering
#     (2) lpf_fc: Low-pass cutoff [Hz]
#     (3) hpf_fc: High-pass cutoff [Hz]
#     (4) decimation: Integer downsampling of the RMM output (Ts=300ps) such
#             that 1.0 / (300ps * decimation) = adc_fs ~ 200 MHz.
#     (5) adc_bits: ADC ENOB currently set to 9b (ADC is 10b)
#     (6) adc_vos: Offset voltage for ADC [V]
#     (7) adc_limits: Single-ended voltage limits at ADC input [V]
#     (8) afe_gain: Linear gain of AFE.  The true gain in the simulator is
#             2X the value shown here due to differential ADC.
#     (9) awgn_density: Thermal noise density of AFE [V/rt-Hz]. Patmos
#             analysis indicated ~ 4 nV/rt-Hz.
-  afe:
     lpf_order: 3
     lpf_fc: 55e6
     hpf_fc: 180e3
     decimation: 17
     adc_bits: 9
     adc_vos: 0.45
     adc_limits:
        - 0.3
        - 1.3
     afe_gain: 7.0
     awgn_density: 10.0e-9
# Signal processing
#    (1) interpolation is the upsampling factor in the digital (200 MHz * 8 = 1.6 GHz)
#    (2) interp_type should be left at WIN_HBF to match hardware.
#    (3) mf_enable should be False.  Simulator includes a MF but it is disabled.
#        MF has negligible impact on performance since SiPM output is nominally
#        the same for solar photons and laser photons. There might be some
#        opportunity for improvement by matching the laser time dispersion and
#        certainly improvement if we ever use coded pulse sequence.
#    (4) off_canc_clip_limit sets the clipping thresholds for the offset
#        cancellation block which clips input at adc_vos +/- off_canc_clip_limit.
#    (5) off_canc_ma_len sets the number of samples in the offset
#        cancellation moving average.
#    (6) acc_scaling is the scale factor at the vector accumulator output.
#    (7) cfar_enable turns the cfar detection on or off.
#    (8) acc_clip forces negative values at the integrator input to zero if True.
#    (9) pkdet_manual_thr allows setting a manual PFA threshold.
#   (10) pkdet_guard sets the number of guard samples in the peak detectors.
-  dsp:
     interpolation: 8
     interp_type: WIN_HBF
     mf_enable: False
     off_canc_clip_limit: 10e-3
     off_canc_ma_len: 16
     acc_scaling: 0.25
     cfar_enable: False
     acc_clip: True
     pkdet_manual_thr: 0.1
     pkdet_guard: 12
# Transmitter
#    (1) Wavelength in [m]
#    (2) pri_per_cpi is a list of the number of PRI within a CPI
-  transmitter:
     wavelength: 905e-9
     pri_per_cpi:
        - 10
        - 20
        - 30
        - 50
        - 100
# General
#   (1) rng_seed sets the seed for the random number generator.  This allows
#       the user to repeat an exact simulation if the RNG seed is known.
#   (2) pfa is the target probability of false alarm (typically 0.01)
#   (3) n_cpi_max is the maximum number of CPI to run in a monte carlo trial.
#   (4) infile specifies a list of the RMM *.npz files to run
-  general:
     rng_seed: 1569427724
     pfa: 0.01
     n_cpi_max: 1000
     infile:
        - time_domain_s0_r10_z10
        - time_domain_s0_r10_z20
        - time_domain_s0_r10_z30
        - time_domain_s0_r10_z40
        - time_domain_s0_r10_z50
        - time_domain_s0_r10_z60
        - time_domain_s0_r10_z70
        - time_domain_s0_r10_z80
        - time_domain_s0_r10_z90
        - time_domain_s0_r10_z100
        - time_domain_s0_r10_z110
        - time_domain_s0_r10_z120
        - time_domain_s0_r10_z130
        - time_domain_s0_r10_z140
        - time_domain_s0_r10_z150
        - time_domain_s0_r10_z160
        - time_domain_s0_r10_z170
